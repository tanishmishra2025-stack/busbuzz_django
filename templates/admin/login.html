
<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>BusBuzz</title>
  <!-- plugins:css -->
  <link rel="stylesheet"
          href="../../static/adminResources/css/materialdesignicons.min.css">
    <link rel="stylesheet"
          href="../../static/adminResources/css/vendor.bundle.base.css">
    <link rel="stylesheet"
          href="../../static/adminResources/css/vendor.bundle.addons.css">
    <!-- endinject -->
    <!-- plugin css for this page -->
    <!-- End plugin css for this page -->
    <!-- inject:css -->
    <link rel="stylesheet" href="../../static/adminResources/css/style.css">
    <!-- endinject -->
    <link rel="shortcut icon"
          href="../../static/adminResources/images/favicon.png"/>
<style>
        .icon_container {
            background: linear-gradient(to left,
            #ff8e97,
            #8b34cc)
        }

        .mdi-icon {
            color: white; /* Icon color */
           /* Adjust icon size as needed */
        }
    </style>
</head>

<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-center auth">
        <div class="row w-100">
          <div class="col-lg-4 mx-auto">
            <div class="auth-form-light text-left p-5">
              <div class="brand-logo">
                            <img src="../../static/adminResources/images/logo.svg"
                                 alt="logo">
                        </div>

              <h4>Hello! let's get started</h4>
              <h6 class="font-weight-light">Sign in to continue.</h6>
              <form class="pt-3" method="post" action="">
              {% csrf_token %}
               
                <div class="form-group">
                   <div class="input-group mb-3">
							<div class="input-group-append ">
								<span class="input-group-text icon_container"><i
                                        class="mdi mdi-account mdi-icon"></i></span>
							</div>
							<input type="text" class="form-control 
							form-control-lg" name="username" 
                                   id="username" 
                                   placeholder="Username..">
						</div>

                </div>

                  <div class="form-groupinput-group mb-3 input-group-append">
							
								<span class="input-group-text icon_container"><i
                                        class="mdi mdi-key-variant mdi-icon
"></i></span>

                      <input type="password"
                             class="form-control form-control-lg"
                             id="password"
                             name="password"
                             placeholder="Enter password...">
                  </div>

               
                  
                <div class="mt-3">
                  <input class="btn btn-block btn-gradient-primary btn-lg
                  font-weight-medium auth-form-btn" style="background:
                    linear-gradient(to
left,
#ff8e97,
#8b34cc)" type="submit" value="SIGN IN">
                </div>
                <div class="my-2 d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <label class="form-check-label text-muted">
                      <input type="checkbox" class="form-check-input">
                      Keep me signed in
                    </label>
                  </div>
                  <a href="/admin/load_error500/" class="auth-link 
                  text-black">Forgot password?</a>
                </div>
                {% for message in messages %}
                    <p id="messages" >{{ message }}</p>
                  {% endfor %}
                <div class="text-center mt-4 font-weight-light">
                  Don't have an account? <a href="/user/load_user/" class="text-primary">Create</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
  </div>
  <!-- container-scroller -->
  <!-- plugins:js -->
  <script src="../../static/adminResources/js/vendor.bundle.base.js"></script>
<script src="../../static/adminResources/js/vendor.bundle.addons.js"></script>
<!-- endinject -->
<!-- inject:js -->
<script src="../../static/adminResources/js/off-canvas.js"></script>
<script src="../../static/adminResources/js/hoverable-collapse.js"></script>
<script src="../../static/adminResources/js/misc.js"></script>
<script src="../../static/adminResources/js/settings.js"></script>
<script src="../../static/adminResources/js/todolist.js"></script>

  <!-- endinject -->
</body>

</html>
